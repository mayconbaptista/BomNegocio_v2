# refs: https://docs.docker.com/compose/extends/
# https://docs.docker.com/compose/compose-file/compose-file-v3/
# https://docs.docker.com/guides/dotnet/develop/

x-app-envs: &app-envs
  Logging__LogLevel__Default: Warning
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080

x-app-aws-envs: &app-aws-envs
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_ENDPOINT_URL: http://localstack-bn:4566

x-app-authentication: &app-authentication
  Authentication__Schemes__Bearer__ValidAudience: https://localhost
  Authentication__Schemes__Bearer__ValidIssuer: bn-auth-sso
  Authentication__Schemes__Bearer__IssuerSigningKey: 15ddb0a7b6b0d2e5fad0c191c4cb96f8c95301e3a05c55fa352a53af7da7ae8b
  Authentication__Schemes__Bearer__RefreshLifeTimeInMinutes: 1440
  Authentication__Schemes__Bearer__TokenLifeTimeInMinutes: 1440

services:

    # Opcional: habilite o profile traefik_local para testar localmente o mesmo
    # salto de borda usado em staging: Traefik -> Ocelot. O Visual Studio nao
    # inicia este container sem o profile, portanto o fluxo atual e preservado.
    traefik.local:
        command:
            - --api.dashboard=false
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
        ports:
            - "8090:80"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        security_opt:
            - no-new-privileges:true

    bom_negocio.db: # somente para desenvolvimento local, nao usar em producao
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-catalog}
            POSTGRES_USER: ${POSTGRES_USER:-catalog}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-catalog}"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - db-data:/var/lib/postgresql/data
            - ./scripts/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro

    auth.webapi:
        environment:
            << : [*app-envs, *app-authentication]
            ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
            ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD}
            ConnectionStrings__Database: ${AUTH_DB_CONNECTION:?Connection string AUTH_DB_CONNECTION not found.}
        ports:
            - "8235:8080"
            - "8236:8081"
        volumes:
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ~/.aspnet/https:/https:ro
            - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        depends_on:
            bom_negocio.db:
                condition: service_healthy
        profiles: ["auth_api"]

    getway.webapi:
        environment:
            <<: *app-envs
        ports:
            - "8080:8080"
            - "8081:8081"
            - "5010:5000" 
        volumes:
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        labels:
            - traefik.enable=true
            - traefik.http.routers.bnshop-local.rule=Host(`localhost`) || Host(`api.bnshop.localhost`)
            - traefik.http.routers.bnshop-local.entrypoints=web
            - traefik.http.services.bnshop-local.loadbalancer.server.port=8080
        profiles: ["getway_webapi"]

    order.webapi:
        environment:
            <<: [*app-envs, *app-aws-envs, *app-authentication]
            EFI__CertificatePath: /home/app/.certs/efi-homologacao-883595.p12
            EFI__CertificatePassword: ${EFI_CERTIFICATE_PASSWORD}
            EFI__Credentials__ClientId: ${EFI_CREDENTIALS_CLIENT_ID}
            EFI__Credentials__ClientSecret: ${EFI_CREDENTIALS_CLIENT_SECRET}
            ConnectionStrings__Database: ${ORDER_DB_CONNECTION:?String de conexao ORDER_DB_CONNECTION nao encontrada.}
        ports:
            - "8888:8080"
            - "8881:8081"
        volumes:
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            #- ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
            - ${APPDATA}/EfiCertificates/efi-homologacao-883595.p12:/home/app/.certs/efi-homologacao-883595.p12:ro
            - ~/.aspnet/https:/https:ro
        depends_on:
            bom_negocio.db:
                condition: service_healthy
        profiles: ["order_api"]

    cart.webapi:
        environment:
            <<: [*app-envs, *app-aws-envs, *app-authentication]
            ConnectionStrings__Database: ${CART_DB_CONNECTION:?String de conexao CART_DB_CONNECTION nao encontrada.}
            GrpcSettings__DiscountUrl: http://catalog.api:5052
        ports:
            - "8087:8080"
            - "8088:8081"
            - "5002:5000"
            - "5003:5001"
        volumes:
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        depends_on:
            bom_negocio.db:
                condition: service_healthy
        profiles: ["cart_api"]
         
    catalog.api:
        environment:
            <<: [*app-envs, *app-aws-envs, *app-authentication]
            ConnectionStrings__Database: ${CATALOG_DB_CONNECTION:?String de conexao CATALOG_DB_CONNECTION nao encontrada.}
        ports:
            - "8989:8080"
            - "5052:5052"
            - "8181:8081"
        volumes:
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        profiles: ["catalog_api"]

    localstack:
        image: localstack/localstack:stable
        container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-bn}"
        ports:
          - "4566:4566"            # LocalStack Gateway
          - "4510-4559:4510-4559"  # external services port range
        environment:
          << : *app-aws-envs
          # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
          DEBUG: ${DEBUG:-1}
          SERVICES: s3,sqs,sns
          LOCALSTACK_HOST: localhost.localstack.cloud:4566
          AWS_DEFAULT_OUTPUT: json
          DISABLE_CORS_CHECK: 1
          EXTRA_CORS_ALLOWED_ORIGINS: "https://app.localstack.cloud"
          LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
        volumes:
          - "${LOCALSTACK_VOLUME_DIR:-./localstack}:/var/lib/localstack"
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "./scripts/localstack:/etc/localstack/init/ready.d"
        profiles: ["localstack"]
        
volumes:
    db-data:
