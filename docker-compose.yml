
services:

    traefik.local:
        image: traefik:v3.5
        container_name: traefik.local
        restart: unless-stopped
        profiles: ["traefik_local"]

    bom_negocio.db: # somente para desenvolvimento local, nao usar em producao
        image: postgres:16.4
        hostname: bom_negocio_db
        container_name: bn_db
        profiles: ["postgresql_db"]

    auth.webapi:
        image: ${DOCKER_REGISTRY-}authwebapi
        hostname: auth.api
        container_name: auth.api
        build:
            context: .
            dockerfile: Auth.WebApi/Dockerfile
        depends_on:
            - bom_negocio.db

    getway.webapi:
        image: ${DOCKER_REGISTRY-}getwaywebapi
        hostname: getway
        container_name: getway
        build:
            context: .
            dockerfile: Getway.WebApi/Dockerfile
        depends_on:
            - auth.webapi
            - cart.webapi
            - catalog.api
            - order.webapi

    order.webapi:
        image: ${DOCKER_REGISTRY-}orderwebapi
        hostname: order.api
        container_name: order.api
        build:
            context: .
            dockerfile: Order.WebApi/Dockerfile
        depends_on:
            - bom_negocio.db
            - localstack

    cart.webapi:
        image: ${DOCKER_REGISTRY-}cartwebapi
        hostname: cart.api
        container_name: cart.api
        build:
            context: .
            dockerfile: Cart.WebApi/Dockerfile
        depends_on:
            - bom_negocio.db
            - localstack

    catalog.api:
        image: ${DOCKER_REGISTRY-}catalogapi
        hostname: catalog.api
        container_name: catalog.api
        build:
            context: .
            dockerfile: Catalog.Api/Dockerfile
        depends_on:
            - bom_negocio.db
            - localstack
