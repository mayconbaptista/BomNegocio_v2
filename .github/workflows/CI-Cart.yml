name: CI para Cart.Api

on:
  push:
    paths:
      - 'Cart.WebApi/**' # Otimização para rodar apenas quando este serviço for alterado

jobs:
  build:
    runs-on: ubuntu-latest # O pipeline vai rodar em uma máquina virtual Linux

    steps:
    # 1. Baixar o código do repositório
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configurar o ambiente .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # Use a versão do seu projeto

    - name: Restore denpendencias
      run: dotnet restore Cart.WebApi/Cart.WebApi.csproj

    - name: Build
      run: dotnet build Cart.WebApi/

  # Job "test_and_coverage" removido em 2026-11-23 (débito técnico registrado
  # nos ADRs): o Cart ainda não tem projeto de testes, e a action usada
  # (irongut/Code-Coverage-Action) não existe. Ao criar o Cart.Tests, reativar
  # com "dotnet test Cart.Tests --collect:'XPlat Code Coverage'" e a action
  # irongut/CodeCoverageSummary (fail_below_min: true + thresholds).